services:
  karino-crm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: karino-crm-production
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=karino_enterprise_jwt_secret_key_prod_2026_983742918734912873
      - SUPABASE_URL=https://xwjodiszshqitcjanamo.supabase.co
      - SUPABASE_KEY=sb_publishable_c4UXK09vyRD-MrO0Uk-rcQ_Ln7NylKN
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
